<state name="view" value="foryou"/><state name="source" value=""/><state name="category" value=""/><state name="limit" value="24"/><state name="reading" value=""/><state name="ask" value=""/><state name="like" value=""/>
<data name="news" lambda="news.screen" with="view={{ state.view }}, source={{ state.source }}, category={{ state.category }}, limit={{ state.limit }}, like={{ state.like }}"/>
<data name="item" lambda="news.item" with="id={{ state.reading }}" when="{{ state.reading }}"/>
<on event="news-changed" action="reload"/>
<on event="pickview" action="state" state="limit" value="24"/>
<on event="pickcat" action="state" state="limit" value="24"/>
<on event="all" action="state" state="limit" value="24"/>
<on event="pickview" action="state" state="category" value=""/>
<on event="pickview" action="state" state="source" value=""/>
<on event="pickcat" action="state" state="source" value=""/>
<on event="pickcat" action="state" state="view" value="{{ state.view == 'foryou' ? 'latest' : state.view }}"/>
<on event="all" action="state" state="category" value=""/>
<on event="all" action="state" state="source" value=""/>
<split side=left width=240>
<col gap=4>
<heading level=2>News</heading>
<col gap=1>
{{#each data.news.views}}
<row gap=2 align=center wrap=false><col fill=true><button action="state" state="view" value="{{ id }}" emit="pickview" label="{{ label }}" variant="{{ on ? 'primary' : 'quiet' }}"/></col>{{#if n}}<small><muted>{{ n }}</muted></small>{{/if}}</row>
{{/each}}
</col>
<button run="news.fetch-round" done="Fetched." emit="news-changed" label="↻ Refresh" variant=primary wide=true/>
{{#if data.news.categories}}
<col gap=1>
<small><muted>Categories</muted></small>
{{#each data.news.categories}}
<row gap=2 align=center wrap=false><col fill=true><button action="state" state="category" value="{{ value }}" emit="pickcat" label="{{ name }}" variant="{{ on ? 'primary' : 'quiet' }}"/></col><small><muted>{{ n }}</muted></small></row>
{{/each}}
{{#if data.news.filtered}}<button emit="all" label="Show everything" variant=quiet/>{{/if}}
</col>
{{/if}}
<button run="news.discover" done="Discover is up to date." emit="news-changed" label="✨ Discover" wide=true/>
<button action="url" href="/settings/news" label="News settings" wide=true/>
</col>
<col gap=3>
{{#if data.news.funnel}}
<box>
<row gap=2 wrap=true align=center>
{{#each data.news.funnel.parts}}{{#if kind == 'br'}}<hr/>{{#else}}{{#if kind == 'head'}}<small><b>{{ text }}</b></small>{{/if}}{{#if kind == 'sep'}}<small><muted>{{ text }}</muted></small>{{/if}}{{#if kind == 'plain'}}<small tip="{{ tip }}">{{ text }}</small>{{/if}}{{#if kind == 'good'}}<small tip="{{ tip }}"><text tone=good>{{ text }}</text></small>{{/if}}{{#if kind == 'warn'}}<small><text tone=warn>{{ text }}</text></small>{{/if}}{{#if kind == 'link'}}<button action="state" state="view" value="filtered" emit="pickview" label="{{ text }}" variant=quiet/>{{/if}}{{/if}}{{/each}}
<grow/>
{{#if data.news.funnel.on}}<button run="news.funnel" with="rounds=10" done="The agent has looked." emit="news-changed" label="Let the agent look now"/>{{#else}}<small><a href="/settings/news#funnel" tip="{{ data.news.funnel.agentTip }}">{{ data.news.funnel.agent }}</a></small>{{/if}}
</row>
</box>
{{/if}}

{{#if data.news.taste}}
<box tone=accent title="✨ Your taste">
{{#if data.news.taste.text}}<text>{{ data.news.taste.text }}</text>{{#else}}<text tone=muted>{{ data.news.taste.none }}</text>{{/if}}
<small><muted>{{ data.news.taste.by }} </muted><a href="/settings/news#taste">{{ data.news.taste.edit }}</a><muted>{{ data.news.taste.pending }}</muted></small>
</box>
{{/if}}
{{#if data.news.llm}}<box>
<row gap=2 wrap=false><col fill=true><input bind="ask" label="Ask your news"/></col><button run="news.ask" with="question={{ state.ask }}" into="answer" label="Ask" disabled="{{ not state.ask }}"/></row>
{{#if data.answer.answer}}<text>{{ data.answer.answer }}</text><row gap=1 wrap=true>{{#each data.answer.sources}}<small><a href="{{ url }}">[{{ n }}] {{ sourceName }}</a></small>{{/each}}</row>{{/if}}
</box>{{/if}}
{{#if data.news.overview}}
<box tone=accent>
<row gap=2 align=center><small><b>Overview · {{ data.news.overview.ago }}</b></small></row>
<text>{{ data.news.overview.text }}</text>
{{#if data.news.overview.themes}}
<grid cols=2 gap=2 min=260>
{{#each data.news.overview.themes}}
<box><b>{{ title }}</b><text>{{ summary }}</text><row gap=1 wrap=true>{{#each links}}<small><a href="{{ url }}" tip="{{ tip }}">[{{ n }}] {{ label }}</a></small>{{/each}}</row></box>
{{/each}}
</grid>
{{/if}}
{{#each data.news.overview.picks}}
<row gap=1 wrap=true><text>• </text><a href="{{ url }}"><b>{{ title }}</b></a><text tone=muted> — {{ why }}</text></row>
{{/each}}
</box>
{{/if}}
{{#if data.news.empty}}
<box>
{{#if data.news.empty == 'starter'}}<button run="news.fetch-round" done="Fetched." emit="news-changed" label="↻ Refresh" variant=primary/><small><muted>{{ data.news.emptyText }} </muted><a href="/settings/news">News settings</a></small>{{/if}}
{{#if data.news.empty == 'funnel'}}<text tone=muted>{{ data.news.emptyText }}</text><row gap=2 wrap=true><button run="news.funnel" with="rounds=10" done="The agent has looked." emit="news-changed" label="Let the agent look now"/><button action="state" state="view" value="latest" emit="pickview" label="See everything unfiltered"/></row>{{/if}}
{{#if data.news.empty == 'old'}}<button run="news.fetch-round" done="Fetched." emit="news-changed" label="↻ Refresh" variant=primary/><small><muted>{{ data.news.emptyText }}</muted></small>{{/if}}
{{#if data.news.empty == 'none'}}<text tone=muted>{{ data.news.emptyText }}</text>{{/if}}
</box>
{{#else}}
{{#if data.news.like}}<row gap=2 align=center><small><muted>More like this</muted></small><button action="state" state="like" value="" emit="news-changed" label="Back" variant=quiet/></row>{{/if}}
<grid cols=3 gap=3 min=280>
{{#each data.news.items}}
<box>
<col gap=2>
{{#if image}}<img src="{{ image }}" alt="{{ title }}"/>{{/if}}
<small><muted>{{ sourceName }} · {{ ago }}{{#if top}} · ★{{/if}}</muted></small>
<b>{{ title }}</b>
{{#if summary}}<text tone=muted>{{ summary }}</text>{{/if}}
{{#if gateWhy}}<small><muted>{{ gateWhy }}</muted></small>{{/if}}
<row gap=1 wrap=true>{{#each tagList}}<chip>{{ tag }}</chip>{{/each}}</row>
<row gap=1 wrap=true>
<button action="state" state="reading" value="{{ id }}" label="Read here" variant=quiet/>
<a href="{{ url }}">Open</a>
<button run="news.more-like" with="id={{ id }}" done="More like this found." then="like={{ id }}" emit="news-changed" label="≈ More" variant=quiet/>
<button run="news.act" with="op=vote, id={{ id }}, value={{ liked ? 0 : 1 }}" emit="news-changed" label="👍" variant="{{ liked ? 'primary' : 'quiet' }}"/>
<button run="news.act" with="op=vote, id={{ id }}, value={{ disliked ? 0 : -1 }}" emit="news-changed" label="👎" variant="{{ disliked ? 'primary' : 'quiet' }}"/>
<button run="news.act" with="op=state, id={{ id }}, state={{ saved ? 'new' : 'saved' }}" emit="news-changed" label="🔖" variant="{{ saved ? 'primary' : 'quiet' }}"/>
<button run="news.act" with="op=state, id={{ id }}, state={{ state == 'hidden' ? 'new' : 'hidden' }}" emit="news-changed" label="{{ state == 'hidden' ? '↩' : '✕' }}" variant=quiet/>
</row>
</col>
</box>
{{/each}}
</grid>
{{#if data.news.hasMore}}<row gap=2 justify=center><button action="state" state="limit" value="{{ data.news.nextLimit }}" label="More"/></row>{{/if}}
<dialog bind="reading" title="{{ data.item.title }}">
{{#if data.item.found}}
<col gap=3>
<small><muted>{{ data.item.source }}</muted></small>
{{#if data.item.image}}<img src="{{ data.item.image }}" alt="{{ data.item.title }}"/>{{/if}}
{{#each data.item.paragraphs}}<text>{{ t }}</text>{{/each}}
<row gap=2><a href="{{ data.item.url }}">Open the page</a></row>
</col>
{{/if}}
</dialog>
{{/if}}
</col>
</split>
