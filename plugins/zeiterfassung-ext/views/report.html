<state name="view" value="week" keep=url/><state name="by" value=""/><state name="aweeks" value="8"/><state name="atickets" value=""/><state name="asplit" value=""/>
<on event="openweek" action="state" state="view" value="week"/>
{{#if state.view == 'month'}}
<data name="m" lambda="zeiterfassung.month" with="month={{ state.month }}, by={{ state.by }}" when="{{ state.view == 'month' }}"/>
<on event="time-changed" action="reload"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <nav inline=true><entry id="week" label="Week" icon="📅" state="view" value="week"/><entry id="month" label="Month" icon="🗓️" state="view" value="month"/><entry id="analysis" label="Analysis" icon="📊" state="view" value="analysis"/><entry id="day" label="End of day" icon="🌙" state="view" value="day"/><entry id="jobs" label="Jobs" icon="💼" state="view" value="jobs"/><entry id="projects" label="Projects" icon="📁" state="view" value="projects"/><entry id="settings" label="Settings" icon="⚙️" state="view" value="settings"/></nav><hr/>
  {{#if data.m}}
  <row gap=2 align=center wrap=true>
    <button action="state" state="month" value="{{ data.m.prev }}" label="←" tip="Previous month" variant=plain size=md/>
    <col width=176 align=center><heading level=2>{{ data.m.label }}</heading><text tone=muted>{{ data.m.weeksText }}</text></col>
    <button action="state" state="month" value="{{ data.m.next }}" label="→" tip="Next month" variant=plain size=md/>
    {{#if not data.m.isCurrent}}<button action="state" state="month" value="{{ data.m.current }}" label="This month" variant=plain/>{{/if}}
  </row>
  <row gap=2 align=end wrap=true>
    <col width=170><input stack=true bind="month" type=month label="Jump to month" value="{{ data.m.key }}"/></col>
    <col width=144><select stack=true bind="by" options="{{ data.m.reporterOptions | tojson }}" label="Reported by"/></col>
    <button action="url" href="{{ data.m.csv }}" label="CSV" variant=plain size=md/>
  </row>
  {{/if}}
</col>
{{#if data.m}}
<col gap=6>
  {{#if data.m.unreadable}}<callout tone=bad>{{ data.m.unreadable }}</callout>{{/if}}
  <grid cols=3 gap=3 min=200 keep=true>
    <tile tint=true label="{{ data.m.booked.label }}" value="{{ data.m.booked.num }}" suffix="{{ data.m.booked.of }}" sub="{{ data.m.booked.sub }}" tone="{{ data.m.booked.tone }}" mark="{{ data.m.booked.mark }}"/>
    <tile tint=true label="{{ data.m.past.label }}" value="{{ data.m.past.value }}" sub="{{ data.m.past.sub }}" tone="{{ data.m.past.tone }}" mark="{{ data.m.past.mark }}">
      {{#if data.m.past.weeks}}<row gap=1 wrap=true>{{#each data.m.past.weeks}}<button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" tip="{{ title }}" variant=chip tone="{{ missing ? 'bad' : 'good' }}"/>{{/each}}</row>{{/if}}
    </tile>
    <tile tint=true label="{{ data.m.entries.label }}" value="{{ data.m.entries.value }}" sub="{{ data.m.entries.sub }}" tone="{{ data.m.entries.tone }}" mark="{{ data.m.entries.mark }}"/>
  </grid>

  <section card=true title="Days" sub="{{ data.m.calendarHint }}">
    {{#if data.m.slotActions}}<row gap=2 wrap=true justify=end align=center>{{#if data.m.oldestPull}}<small><muted>{{ data.m.oldestPull }}</muted></small>{{/if}}{{#each data.m.slotActions}}<button run="{{ flow }}" with="{{ with }}" emit="time-changed" confirm="{{ confirm }}" label="{{ label }}" tip="{{ tip }}" variant=plain/>{{/each}}</row>{{/if}}
    <grid tracks="3rem repeat(7,minmax(0,1fr)) 4.5rem" gap=1 minw=576>
      <text></text>
      {{#each data.m.weekdays}}<col><small tone=muted><b>{{ this | upper }}</b></small></col>{{/each}}
      <col align=end><small tone=muted><b>WEEK</b></small></col>
      {{#each data.m.calendar}}
      <col align=center><button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" tip="{{ title }}" variant=quiet/></col>
      {{#each cells}}
      {{#if in}}
      <box dense=true tone="{{ tone }}" ring="{{ today ? 'true' : 'false' }}" action="state" state="week" value="{{ week }}" emit="openweek" tip="{{ title }}">
        <row justify=between><small>{{#if today}}<b>{{ day }}</b>{{#else}}{{ day }}{{/if}}</small><small>{{ note }}</small></row>
        <col align=end><text><b>{{ main }}</b>{{#if gap}} <small>{{ gap }}</small>{{/if}}</text></col>
      </box>
      {{#else}}<text></text>{{/if}}
      {{/each}}
      <col align=end gap=0><text><b>{{ booked }}</b></text><small tone=muted>{{ of }}</small></col>
      {{/each}}
    </grid>
    <small><muted>red: hours missing · amber: due today · grey: off / absent</muted></small>
    {{#if data.m.approvals}}<row gap=3 wrap=true><small><muted>green: {{ data.m.approvals.legendAll }}</muted></small><small><muted>8 / 12 {{ data.m.approvals.legendPartly }}</muted></small><small><muted>{{ data.m.approvals.legendNone }}</muted></small>{{#if data.m.approvals.unpulled}}<small><muted>{{ data.m.approvals.unpulled }}</muted></small>{{/if}}</row>{{/if}}
  </section>

  <section card=true title="Hours per job and week">
    {{#if data.m.jobRows}}
    <sheet compact=true caption="Hours per job and week">
      <shead><srow>
        <scell head=true>Job</scell>
        {{#each data.m.weekHeads}}<scell head=true num=true><col align=end><button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" variant=link/><small>{{ range }}</small></col></scell>{{/each}}
        <scell head=true num=true>Total</scell>
        <scell head=true num=true>Share</scell>
      </srow></shead>
      <sbody>
        {{#each data.m.jobRows}}
        <srow hover=true>
          <scell row=true>{{#if project}}<text><b>{{ project }}</b></text><small tone=muted><mono>{{ number }}</mono></small>{{#else}}<text><b>{{ number }} {{ name }}</b></text>{{#if customer}}<small tone=muted>{{ customer }}</small>{{/if}}{{/if}}</scell>
          {{#each weeks}}<scell num=true>{{ this }}</scell>{{/each}}
          <scell num=true bold=true>{{ total }}</scell>
          <scell num=true tone=muted>{{ share }}</scell>
        </srow>
        {{/each}}
      </sbody>
      <sfoot>
        <srow bold=true><scell row=true>Booked</scell>{{#each data.m.foot.booked}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.bookedTotal }}</scell><scell num=true></scell></srow>
        {{#if data.m.foot.missing}}<srow bold=true tone=bad><scell row=true>Missing</scell>{{#each data.m.foot.missing}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.missingTotal }}</scell><scell num=true></scell></srow>{{/if}}
        <srow tone=muted><scell row=true>Target</scell>{{#each data.m.foot.target}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.targetTotal }}</scell><scell num=true></scell></srow>
      </sfoot>
    </sheet>
    {{#else}}<text tone=muted>{{ data.m.emptyJobs }}</text>{{/if}}
  </section>

  <grid cols=2 gap=4 min=300>
    <section card=true title="Hours by type">
      <chart kind=bar look=track source="data.m.typeItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
    <section card=true title="Hours by tag">
      <chart kind=bar look=track source="data.m.tagItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
  </grid>

  <section card=true title="{{ data.m.reportHead }}" sub="{{ data.m.reportMeta }}">
    {{#if data.m.summaries}}
    <row justify=end><copy text="{{ data.m.summaryText }}" label="Copy report"/></row>
    <col gap=3>
    {{#each data.m.summaries}}
    <section framed=true collapsible=true open=true title="{{ number }} {{ name }}" aside="{{ share }} · {{ hours }}">
      {{#each lines}}
      <row justify=between gap=3 wrap=false align=start><text>{{ label }} {{#if count}}<small tone=muted>{{ count }}</small>{{/if}}</text><row gap=2 wrap=false><small tone=muted tip="{{ title }}">{{ days }}</small><badge tint="{{ color }}">{{ type }}</badge><b>{{ hours }}</b></row></row>
      {{/each}}
    </section>
    {{/each}}
    </col>
    {{#else}}<text tone=muted>No time booked in this month.</text>{{/if}}
  </section>

  <section card=true title="{{ data.m.entriesHead }}" aside="{{ data.m.entryList | count }}" collapsible=true open=false>
    {{#if data.m.entryList}}
    <sheet compact=true caption="Entries of the month">
      <shead><srow><scell head=true>Date</scell><scell head=true>Job</scell><scell head=true num=true>Hours</scell><scell head=true>Report</scell><scell head=true>Ticket</scell><scell head=true>Type · tags</scell><scell head=true></scell></srow></shead>
      <sbody>
        {{#each data.m.entryList}}
        <srow hover=true>
          <scell><col gap=0><mono size=sm><edit type=date value="{{ date }}" label="Date" tip="Click to change the day" run="zeiterfassung.entry-op" with="op=date, id={{ id }}, date=$value" emit="time-changed" done="Saved."/></mono>{{#if start}}<small tone=muted><mono>{{ start }}</mono></small>{{/if}}</col></scell>
          <scell><col width=150><truncate tip="{{ job }}">{{ jobName }}</truncate></col></scell>
          <scell num=true bold=true><edit type=number value="{{ hoursValue }}" text="{{ hours }}" min=0.25 max=24 step=0.25 label="Hours" tip="Click to change the hours" run="zeiterfassung.entry-hours" with="id={{ id }}, hours=$value" emit="time-changed" done="Saved."/></scell>
          <scell>{{#if mark}}<small tip="{{ markTitle }}">{{ mark }}</small> {{/if}}{{ description }}</scell>
          <scell>{{#if ticket}}{{#if ticketUrl}}<button action="url" href="{{ ticketUrl }}" label="{{ ticket }}" tip="{{ ticketTip }}" variant=link/>{{#else}}<mono size=sm>{{ ticket }}</mono>{{/if}}{{/if}}</scell>
          <scell><col gap=1 align=start><badge tint="{{ color }}">{{ type }}</badge>{{#each tagNames}}<badge color=teal>{{ this }}</badge>{{/each}}</col></scell>
          <scell><button action="state" state="week" value="{{ date }}" emit="openweek" label="→" tip="Open its week to edit it" variant=quiet/></scell>
        </srow>
        {{/each}}
      </sbody>
    </sheet>
    {{#else}}<empty text="No entries."/>{{/if}}
  </section>
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>

{{#else}}
{{#if state.view == 'analysis'}}
<data name="a" lambda="zeiterfassung.analysis" with="weeks={{ state.aweeks }}, tickets={{ state.atickets }}, split={{ state.asplit }}" when="{{ state.view == 'analysis' }}"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <nav inline=true><entry id="week" label="Week" icon="📅" state="view" value="week"/><entry id="month" label="Month" icon="🗓️" state="view" value="month"/><entry id="analysis" label="Analysis" icon="📊" state="view" value="analysis"/><entry id="day" label="End of day" icon="🌙" state="view" value="day"/><entry id="jobs" label="Jobs" icon="💼" state="view" value="jobs"/><entry id="projects" label="Projects" icon="📁" state="view" value="projects"/><entry id="settings" label="Settings" icon="⚙️" state="view" value="settings"/></nav><hr/>
  <col gap=1><heading level=2>Analysis</heading>{{#if data.a}}<text tone=muted>{{ data.a.intro }}</text>{{/if}}</col>
  {{#if data.a}}
  <row gap=1>
    <button action="state" state="atickets" value="" label="Everyone" variant="{{ data.a.mine ? 'plain' : 'primary' }}" tip="Jira metrics for everyone's tickets, or only the tickets you booked time on in this range"/>
    <button action="state" state="atickets" value="mine" label="Mine" variant="{{ data.a.mine ? 'primary' : 'plain' }}"/>
  </row>
  <row gap=1 wrap=true>
    {{#each data.a.ranges}}<button action="state" state="aweeks" value="{{ weeks }}" label="{{ label }}" variant="{{ weeks == data.a.weeks ? 'primary' : 'plain' }}"/>{{/each}}
  </row>
  {{/if}}
</col>
{{#if data.a}}
<col gap=6>
  {{#if data.a.hasData}}
  <col gap=3>
  <grid cols=5 gap=3 min=150>
    {{#each data.a.cards}}<tile label="{{ label }}" value="{{ value }}" tip="{{ hint }}" tint=true/>{{/each}}
  </grid>
  {{#if data.a.jiraCards}}<grid cols=4 gap=3 min=150>{{#each data.a.jiraCards}}<tile tint=true label="{{ label }}" value="{{ value }}" tone="{{ tone }}" tip="{{ hint }}"/>{{/each}}</grid>{{/if}}
  {{#if data.a.ticketCards}}<grid cols=4 gap=3 min=150>{{#each data.a.ticketCards}}<tile tint=true label="{{ label }}" value="{{ value }}" tone="{{ tone }}" tip="{{ hint }}"/>{{/each}}</grid>{{/if}}
  </col>

  <grid cols=2 gap=4 min=320>
    <section card=true title="Time split by type">
      <row gap=6 align=center wrap=false>
        <chart kind=pie source="data.a.typeSplit" group="label" value="hours" center="{{ data.a.meetingPercent }}" centersub="Meetings" legend=false/>
        <col gap=2>
          {{#each data.a.typeSplit}}<row gap=2 align=center wrap=false><dot color="{{ color }}"/><col width=80><truncate tip="{{ label }}">{{ label }}</truncate></col><b>{{ hoursText }}</b><small tone=muted>{{ pct }}</small></row>{{/each}}
        </col>
      </row>
    </section>
    <section card=true title="Hours by job">
      <chart kind=bar look=track source="data.a.jobItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
  </grid>

  <section card=true title="Weekly hours & tickets" aside="{{ data.a.weekLegend }}">
    <chart kind=column look=track source="data.a.weekRows" group="week" value="hours" series="type" text="badge"/>
  </section>

  {{#if data.a.ticketCards}}
  <grid cols=2 gap=4 min=320>
    <section card=true title="Performance" aside="resolution time · lower is better">
      <chart kind=line source="data.a.performance" group="week" value="days"/>
      <small><muted>Avg days from a ticket opening to its resolution, by the week it was resolved.</muted></small>
    </section>
    <section card=true title="Parallelism" aside="tickets open at once">
      <chart kind=line source="data.a.parallel" group="week" value="tickets"/>
      <small><muted>Number of tickets in flight (opened but not yet resolved) during each week.</muted></small>
    </section>
  </grid>
  {{/if}}
  {{#if data.a.datesHint}}<callout tone=info>Reaction time and parallelism need ticket opened dates. Re-sync on the Jira tab to backfill them.</callout>{{/if}}

  <grid cols=2 gap=4 min=320>
    <section card=true>
      <row gap=2 align=center><text tone=muted><b>HOURS BY</b></text><select bind="asplit" options='[["","Tag"],["type","Type"]]' value="{{ data.a.split == 'type' ? 'type' : '' }}"/></row>
      <chart kind=bar look=track source="data.a.splitItems" group="label" value="value" text="valueLabel" empty="{{ data.a.splitEmpty }}"/>
    </section>
    <section card=true title="Top tickets by hours">
      <chart kind=bar look=track source="data.a.ticketItems" group="label" value="value" text="valueLabel" link="url" empty="No tickets."/>
    </section>
  </grid>
  <small tone=muted>{{ data.a.foot }}</small>
  {{#else}}<box><text tone=muted>{{ data.a.empty }}</text></box>{{/if}}
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>

{{#else}}
{{#if state.view == 'day'}}
<data name="f" lambda="zeiterfassung.day" with="date={{ state.fdate }}, week={{ state.fweek }}, state={{ state | tojson }}" when="{{ state.view == 'day' }}" debounce=600/>
<on event="day-changed" action="reload"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <nav inline=true><entry id="week" label="Week" icon="📅" state="view" value="week"/><entry id="month" label="Month" icon="🗓️" state="view" value="month"/><entry id="analysis" label="Analysis" icon="📊" state="view" value="analysis"/><entry id="day" label="End of day" icon="🌙" state="view" value="day"/><entry id="jobs" label="Jobs" icon="💼" state="view" value="jobs"/><entry id="projects" label="Projects" icon="📁" state="view" value="projects"/><entry id="settings" label="Settings" icon="⚙️" state="view" value="settings"/></nav><hr/>
  {{#if data.f}}
  <col gap=3>
    <heading level=2>{{ data.f.title }}</heading>
    <text tone=muted>{{ data.f.intro }}</text>
    <text>{{#if data.f.mode == 'week'}}<button action="state" state="fweek" value="" label="← End of day" variant=link/>{{#else}}<button action="state" state="fweek" value="current" label="The whole week →" variant=link/>{{/if}}</text>
    <small tone=muted>It's booked just like by hand; then everything is in the weekly report (and goes from there to Chrono/Punch when you export).</small>
  </col>
  {{/if}}
</col>
{{#if data.f}}
<col gap=6>
  {{#if data.fbooked.fbooked.message}}
  <callout tone=good>
    <row gap=2 align=center justify=between wrap=true>
      <text>{{ data.fbooked.fbooked.message }}</text>
      {{#if data.fbooked.fbooked.created}}<button run="zeiterfassung.day-undo" with="created={{ data.fbooked.fbooked.created }}" into="fundone" emit="day-changed" done="Taken back." label="Undo" variant=plain/>{{/if}}
    </row>
  </callout>
  {{/if}}
  {{#each data.f.days}}
  {{#if data.f.mode == 'week'}}<heading level=3>{{ head }} <small tone=muted>{{ sub }}</small></heading>{{/if}}
  <section card=true>
    <row gap=4 wrap=true align=start justify=between>
      <row gap=6 wrap=true align=center>
        <text>{{ sums.booked }}</text><text>{{ sums.selected }}</text>
        {{#if sums.itemized}}<text tone=muted>{{ sums.itemized }}</text>{{/if}}
        <text tone="{{ sums.tone }}">{{ sums.result }}</text>
      </row>
      <col gap=1 align=end>
        <row gap=2 align=center>
          <button action="state" state="{{ spreadKey }}" value="{{ spreadOn ? '' : '1' }}" label="Spread the rest" tip="Spread the missing hours over the ticked ticket lines" variant="{{ spreadOn ? 'primary' : 'plain' }}" disabled="{{ canSpread ? 'false' : 'true' }}"/>
          <button run="zeiterfassung.day-book" with="date={{ date }}, state={{ state | tojson }}" into="fbooked" emit="day-changed" label="{{ bookLabel }}" disabled="{{ whyNot ? 'true' : 'false' }}" variant=primary/>
        </row>
        {{#if whyNot}}<small tone=warn>{{ whyNot }}</small>{{/if}}
      </col>
    </row>
  </section>
    {{#if lines}}
    <col gap=2>
      {{#each lines}}
      <let name="inc" value="state | get(ki) | default(include)"/>
      <box tone="{{ inc == '1' ? 'plain' : 'muted' }}">
        <row gap=2 align=center wrap=true>
          <button action="state" state="{{ ki }}" value="{{ inc == '1' ? '0' : '1' }}" label="{{ inc == '1' ? '☑' : '☐' }}" tip="Book {{ description }}" variant=quiet/>
          <small><muted>{{ kindLabel }}</muted></small>
          <input bind="{{ kh }}" type=number label="Hours" value="{{ hours }}" placeholder="h"/>
          {{#if kind == 'suggestion'}}<small><muted>{{ jobText }}</muted></small>{{#else}}<select bind="{{ kj }}" options="{{ jobOptions | tojson }}" label="Job"/>{{/if}}
          <input bind="{{ kd }}" label="Description" value="{{ description }}"/>
        </row>
        <row gap=3 wrap=true align=center>
          <small><muted>{{#if ticket}}{{ ticket }} · {{/if}}{{ from }}</muted></small>
          {{#if isGroup}}<small>Group: the day's work goes under it</small>{{/if}}
          {{#if itemize}}<let name="sep" value="state | get(ks) | default(standalone)"/><button action="state" state="{{ ks }}" value="{{ sep == '1' ? '0' : '1' }}" label="{{ sep == '1' ? '☐' : '☑' }} {{ itemize }}" variant=quiet/>{{/if}}
        </row>
      </box>
      {{/each}}
    </col>
    {{#else}}<col align=center><text tone=muted>{{ empty }}</text></col>{{/if}}
  {{/each}}
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>

{{#else}}
{{#if state.view == 'jobs' or state.view == 'projects'}}
<data name="j" lambda="zeiterfassung.jobs" with="n={{ state.jn }}" when="{{ state.view == 'jobs' or state.view == 'projects' }}"/>
<on event="jobs-changed" action="reload"/>
<data name="d" lambda="zeiterfassung.job-detail" with="ref={{ state.jd }}" when="{{ state.jd }}"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <nav inline=true><entry id="week" label="Week" icon="📅" state="view" value="week"/><entry id="month" label="Month" icon="🗓️" state="view" value="month"/><entry id="analysis" label="Analysis" icon="📊" state="view" value="analysis"/><entry id="day" label="End of day" icon="🌙" state="view" value="day"/><entry id="jobs" label="Jobs" icon="💼" state="view" value="jobs"/><entry id="projects" label="Projects" icon="📁" state="view" value="projects"/><entry id="settings" label="Settings" icon="⚙️" state="view" value="settings"/></nav><hr/>
  {{#if state.view == 'projects'}}
  <col gap=1><heading level=2>Projects</heading><text tone=muted>Book time on a project instead of a job — e.g. a training. The hours land on the project's job, and setting or changing that job later moves all its entries along.</text></col>
  {{#else}}
  <col gap=1><heading level=2>Jobs</heading><text tone=muted>Job numbers that time can be booked on — from the web UI or via the MCP report_time tool.</text></col>
  {{/if}}
</col>
{{#if data.j}}
<col gap=6>
  {{#if state.jd}}{{#if data.d.found}}
  <section card=true title="{{ data.d.title }}" aside="{{ data.d.sub }}">
    <col gap=2>
      <row gap=2 align=center wrap=true>
        <button action="state" state="jd" value="" label="← All jobs" variant=plain/>
        {{#if data.d.inactive}}<small><muted>inactive</muted></small>{{/if}}
        {{#if data.d.job}}<small><muted>{{ data.d.job }}</muted></small>{{/if}}
        <button run="zeiterfassung.job-delete" with="kind={{ data.d.kind }}, id={{ data.d.id }}" confirm="{{ data.d.deleteConfirm }}" then="jd=" emit="jobs-changed" done="Deleted." label="Delete" variant=danger/>
      </row>
      {{#if data.d.noJobWarning}}<callout tone=warn>{{ data.d.noJobWarning }}</callout>{{/if}}
      {{#if data.d.today}}
      <section title="Book days" collapsible=true open=false>
        <col gap=2>
          <text tone=muted>One entry per working day — e.g. all days of a training. Single entries can also be booked on the project from the week page (“Book on”).</text>
          <grid cols=4 gap=2 min=150>
            <input bind="bd_from" type=date label="From" value="{{ data.d.today }}"/>
            <input bind="bd_to" type=date label="To"/>
            <input bind="bd_hours" type=number label="Hours" placeholder="the day's target"/>
            <select bind="bd_type" options="{{ data.d.typeOptions | tojson }}" label="Type"/>
          </grid>
          <input bind="bd_desc" label="Description" value="{{ data.d.title }}"/>
          <row gap=2><button run="zeiterfassung.book-days" with="id={{ data.d.id }}, from={{ state.bd_from | default(data.d.today) }}, to={{ state.bd_to }}, hours={{ state.bd_hours }}, type={{ state.bd_type }}, description={{ state.bd_desc | default(data.d.title) }}" into="jsaved" emit="jobs-changed" label="Book days" variant=primary/></row>
        </col>
      </section>
      {{/if}}
      {{#if data.d.entries}}
      <sheet compact=true caption="Entries">

            <scell num=true bold=true><edit type=number value="{{ hoursValue }}" text="{{ hours }}" min=0.25 max=24 step=0.25 label="Hours" tip="Click to change the hours" run="zeiterfassung.entry-hours" with="id={{ id }}, hours=$value" emit="jobs-changed" done="Saved."/></scell>

  {{#if data.jsaved.jsaved.message}}<callout tone=good>{{ data.jsaved.jsaved.message }}</callout>{{/if}}

  <section card=true title="{{ data.j.projectsHead }}">
    {{#if data.j.projects}}
    <sheet caption="All projects">
      <shead><srow><scell head=true>Title</scell><scell head=true>Job</scell><scell head=true>Customer</scell><scell head=true>Booked</scell><scell head=true num=true>Hours</scell><scell head=true num=true>Entries</scell><scell head=true>Status</scell><scell head=true></scell></srow></shead>
      <sbody>
        {{#each data.j.projects}}
        <srow tone="{{ active ? 'plain' : 'muted' }}">
          <scell><text><b>{{ title }}</b></text>{{#if description}}<small tone=muted>{{ description }}</small>{{/if}}{{#if tags}} <small tone=muted>{{ tags }}</small>{{/if}}</scell>
          <scell>{{#if jobNumber}}{{ job }}{{#else}}<badge tint="#f59e0b">{{ job }}</badge>{{/if}}</scell>
          <scell>{{ customer }}</scell>
          <scell><mono>{{ booked }}</mono></scell>
          <scell num=true>{{ hours }}</scell>
          <scell num=true>{{ entries }}</scell>
          <scell><badge tint="{{ active ? '#7c3aed' : '#a1a1aa' }}">{{ status }}</badge></scell>

  <dialog bind="projectedit" reset="ep_" title="Edit project">
    {{#each data.j.projects | where('id', state.projectedit)}}
    <let name="pcu" value="state | get('ep_customer') | default(customer)"/>
    <let name="pde" value="state | get('ep_description') | default(description)"/>
    <col gap=2>
      <grid cols=2 gap=2 min=150>
        <input bind="ep_title" label="Title" value="{{ title }}"/>
        {{#if data.j.jobOptions}}<select bind="ep_job" value="{{ jobNumber }}" options="{{ data.j.jobOptions | tojson }}" search=true label="Job"/>{{#else}}<text tone=warn>No active jobs yet — create one on the Jobs page before booking time.</text>{{/if}}
        <input bind="ep_customer" label="Customer" value="{{ customer }}"/>
        <input bind="ep_tags" label="Default tags" value="{{ tags }}"/>

      <input bind="ep_description" label="Description" value="{{ description }}"/>
      <row gap=2><button run="zeiterfassung.project-save" with="id={{ id }}, full=true, title={{ state.ep_title | default(title) }}, jobNumber={{ state.ep_job | default(jobNumber) }}, customer={{ state.ep_customer == '' ? '~' : pcu }}, description={{ state.ep_description == '' ? '~' : pde }}, defaultTags={{ state.ep_tags | default(tags) }}" into="jsaved" then="projectedit=" emit="jobs-changed" label="Save" variant=primary/></row>
    </col>
    {{/each}}
  </dialog>
  {{#else}}
  <section card=true title="New job">
    <col gap=3>
      <grid cols=3 gap=3 min=180>
        <input stack=true bind="nj_number" label="Job number" placeholder="2026-0815"/>
        <input stack=true bind="nj_name" label="Name" placeholder="Website relaunch"/>
        <input stack=true bind="nj_customer" label="Customer" placeholder="ACME GmbH"/>
      </grid>
      <grid tracks="minmax(0,1.5fr) minmax(0,1fr) minmax(0,0.5fr)" gap=3>
        <input stack=true bind="nj_description" label="Description" placeholder="Optional notes"/>
        <input stack=true bind="nj_tags" label="Default tags" placeholder="Add tag…"/>
        <col align=end><button run="zeiterfassung.job-save" with="number={{ state.nj_number }}, name={{ state.nj_name }}, customer={{ state.nj_customer }}, description={{ state.nj_description }}, defaultTags={{ state.nj_tags }}" into="jsaved" then="nj_number=" emit="jobs-changed" label="Create job" variant=primary size=md wide=true/></col>
      </grid>
    </col>
  </section>
  <section card=true title="{{ data.j.jobsHead }}">
    {{#if data.j.toolbar}}<row gap=2 wrap=true justify=end>{{#each data.j.toolbar}}<button run="{{ flow }}" with="{{ with }}" emit="jobs-changed" confirm="{{ confirm }}" label="{{ label }}" tip="{{ tip }}" variant=plain/>{{/each}}</row>{{/if}}
    {{#if data.j.jobs}}
    <sheet caption="All jobs">
      <shead><srow><scell head=true>Number</scell><scell head=true>Name</scell><scell head=true>Customer</scell><scell head=true num=true>Hours</scell><scell head=true num=true>Entries</scell>{{#if data.j.columnTitle}}<scell head=true>{{ data.j.columnTitle }}</scell>{{/if}}<scell head=true>Status</scell><scell head=true></scell></srow></shead>
      <sbody>
        {{#each data.j.jobs}}
        <srow tone="{{ active ? 'plain' : 'muted' }}">
          <scell><mono size=sm>{{ number }}</mono></scell>
          <scell><text><b>{{ name }}</b></text>{{#if description}}<small tone=muted>{{ description }}</small>{{/if}}{{#if tags}} <small tone=muted>{{ tags }}</small>{{/if}}</scell>
          <scell>{{ customer }}</scell>
          <scell num=true>{{ hours }}</scell>
          <scell num=true>{{ entries }}</scell>
          {{#if data.j.columnTitle}}<scell><small tip="{{ markTitle }}">{{ mark }}</small></scell>{{/if}}
          <scell><badge tint="{{ active ? '#7c3aed' : '#a1a1aa' }}">{{ status }}</badge></scell>
          <scell><row gap=1 justify=end wrap=false>
            <button action="state" state="jd" value="job:{{ id }}" label="Open" variant=plain/>
            <button action="state" state="jobedit" value="{{ id }}" label="Edit" variant=plain/>
            <button run="zeiterfassung.job-save" with="id={{ id }}, active={{ active ? 'false' : 'true' }}" emit="jobs-changed" label="{{ toggle }}" variant=plain/>
          </row></scell>
        </srow>
        {{/each}}
      </sbody>
    </sheet>
    {{#else}}<empty text="No jobs yet."/>{{/if}}
  </section>
  <dialog bind="jobedit" reset="ej_" title="Edit job">
    {{#each data.j.jobs | where('id', state.jobedit)}}
    <let name="ecu" value="state | get('ej_customer') | default(customer)"/>
    <let name="ede" value="state | get('ej_description') | default(description)"/>
    <col gap=2>
      <grid cols=2 gap=2 min=150>
        <input bind="ej_number" label="Number" value="{{ number }}"/>
        <input bind="ej_name" label="Name" value="{{ name }}"/>
        <input bind="ej_customer" label="Customer" value="{{ customer }}"/>
        <input bind="ej_tags" label="Default tags" value="{{ tags }}"/>
      </grid>
      <input bind="ej_description" label="Description" value="{{ description }}"/>
      <row gap=2><button run="zeiterfassung.job-save" with="id={{ id }}, full=true, number={{ state.ej_number | default(number) }}, name={{ state.ej_name | default(name) }}, customer={{ state.ej_customer == '' ? '~' : ecu }}, description={{ state.ej_description == '' ? '~' : ede }}, defaultTags={{ state.ej_tags | default(tags) }}" into="jsaved" then="jobedit=" emit="jobs-changed" label="Save" variant=primary/></row>
    </col>
    {{/each}}
  </dialog>
  {{/if}}
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>

{{#else}}
{{#if state.view == 'settings'}}
<data name="s" lambda="zeiterfassung.schedule" with="n={{ state.sn }}" when="{{ state.view == 'settings' }}"/>
<on event="settings-changed" action="reload"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <nav inline=true><entry id="week" label="Week" icon="📅" state="view" value="week"/><entry id="month" label="Month" icon="🗓️" state="view" value="month"/><entry id="analysis" label="Analysis" icon="📊" state="view" value="analysis"/><entry id="day" label="End of day" icon="🌙" state="view" value="day"/><entry id="jobs" label="Jobs" icon="💼" state="view" value="jobs"/><entry id="projects" label="Projects" icon="📁" state="view" value="projects"/><entry id="settings" label="Settings" icon="⚙️" state="view" value="settings"/></nav><hr/>
  <col gap=1><heading level=2>Time-tracking settings</heading><text tone=muted>Set your weekly working pattern (part-time) and record time off. The weekly report uses this to show booked hours against your target.</text></col>
</col>
<col gap=6>
{{#if data.s}}
<col gap=6>
  {{#if data.ssaved.ssaved.message}}<callout tone=good>{{ data.ssaved.ssaved.message }}</callout>{{/if}}

  <section card=true title="{{ data.s.hoursHead }}">
    <col gap=2>
      <grid cols=7 gap=2 min=70>
        {{#each data.s.days}}<input stack=true bind="sh_{{ key }}" label="{{ label }}" value="{{ hours }}"/>{{/each}}
      </grid>
      <row gap=2><button run="zeiterfassung.schedule-save" with="what=hours, mon={{ state.sh_mon | default(data.s.h_mon) }}, tue={{ state.sh_tue | default(data.s.h_tue) }}, wed={{ state.sh_wed | default(data.s.h_wed) }}, thu={{ state.sh_thu | default(data.s.h_thu) }}, fri={{ state.sh_fri | default(data.s.h_fri) }}, sat={{ state.sh_sat | default(data.s.h_sat) }}, sun={{ state.sh_sun | default(data.s.h_sun) }}" into="ssaved" emit="settings-changed" label="Save working hours" variant=primary/><small tone=muted>A day set to 0 counts as non-working (e.g. free Fridays).</small></row>
    </col>
  </section>

  <section card=true title="Default break">
    <col gap=2>
      <text tone=muted>Your usual break window on workdays, e.g. 12:00-13:00 (several with “;”). The weekly table shows it greyed out on days without an entered break.</text>
      <input stack=true bind="sp_text" label="Default break" value="{{ data.s.defaultPauses }}" placeholder="12:00-13:00"/>
      {{#if data.s.punchOn}}<button action="state" state="sp_punch" value="{{ (state | get('sp_punch') | default(data.s.punchExport)) == '1' ? '0' : '1' }}" label="{{ (state | get('sp_punch') | default(data.s.punchExport)) == '1' ? '☑' : '☐' }} Punch records it too" variant=quiet/>{{/if}}
      <row gap=2><button run="zeiterfassung.schedule-save" with="what=pauses, punch={{ state | get('sp_punch') | default(data.s.punchExport) }}, text={{ state.sp_text | default(data.s.defaultPauses) }}" into="ssaved" emit="settings-changed" label="Save default break" variant=primary/></row>
    </col>
  </section>

  <section card=true title="Absence jobs">
    <col gap=3>
      <text tone=muted>The job each kind of absence is booked on. With one, the weekly table gets a greyed-out row for it under the booked jobs: the absence's hours on its days — a click books them there (for Chrono and Punch), and what is booked there counts towards the day. Without one, an absence only lowers the day's target.</text>
      <grid cols=4 gap=3 min=160>
        {{#each data.s.absenceJobs}}<select stack=true bind="aj_{{ key }}" value="{{ job }}" options="{{ data.s.absenceJobOptions | tojson }}" label="{{ label }}"/>{{/each}}
      </grid>
      <let name="aj_vacation" value="state | get('aj_vacation') | default(data.s.aj.vacation)"/>
      <let name="aj_sick" value="state | get('aj_sick') | default(data.s.aj.sick)"/>
      <let name="aj_holiday" value="state | get('aj_holiday') | default(data.s.aj.holiday)"/>
      <let name="aj_other" value="state | get('aj_other') | default(data.s.aj.other)"/>
      <row gap=2><button run="zeiterfassung.schedule-save" with="what=absence-jobs, vacation={{ state.aj_vacation == '' ? '~' : aj_vacation }}, sick={{ state.aj_sick == '' ? '~' : aj_sick }}, holiday={{ state.aj_holiday == '' ? '~' : aj_holiday }}, other={{ state.aj_other == '' ? '~' : aj_other }}" into="ssaved" emit="settings-changed" label="Save absence jobs" variant=primary/></row>
    </col>
  </section>

  <section card=true title="Flex time">
    <col gap=2>
      <text tone=muted>The job for hours you take off your overtime. In the weekly table, days that aren't fully booked get a greyed-out row for it under the booked jobs.</text>
      <grid cols=2 gap=2 min=200>
        <select stack=true bind="sf_job" value="{{ data.s.flexJob }}" options="{{ data.s.flexJobOptions | tojson }}" label="Gleitzeit job"/>
        <input stack=true bind="sf_comment" label="Comment" value="{{ data.s.flexComment }}"/>
      </grid>
      <row gap=2><button run="zeiterfassung.schedule-save" with="what=flex, jobNumber={{ state.sf_job | default(data.s.flexJob) }}, comment={{ state.sf_comment | default(data.s.flexComment) }}" into="ssaved" emit="settings-changed" label="Save flex time" variant=primary/></row>
    </col>
  </section>

</col>
{{#else}}<text tone=muted>…</text>{{/if}}

<data name="r" lambda="zeiterfassung.rules" with="n={{ state.rn }}" when="{{ state.view == 'settings' }}"/>
<on event="rules-changed" action="reload"/>
{{#if data.r}}
<col gap=6>
  {{#if data.rsaved.rsaved.message}}<callout tone=good>{{ data.rsaved.rsaved.message }}</callout>{{/if}}

  <section card=true title="Entry type rules">
    <col gap=2>
      <text tone=muted>Infer an entry's type (Ticket, Meeting, Internal, Other, Absence) from its job and description — e.g. job Abwesenheit + “Urlaub” → Absence. The first rule that matches wins.</text>
      {{#each data.r.typeRules}}
      <row gap=2 align=center wrap=true>
        <text>When job is <b>{{ job }}</b> and description contains <b>{{ text }}</b> → <b>{{ type }}</b></text>
        <button action="state" state="ruleedit" value="types:{{ i }}" label="✎" tip="Edit" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=types, op=up, index={{ i }}" into="rsaved" emit="rules-changed" label="↑" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=types, op=down, index={{ i }}" into="rsaved" emit="rules-changed" label="↓" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=types, op=remove, index={{ i }}" into="rsaved" emit="rules-changed" label="✕" variant=quiet/>
      </row>
      {{/each}}
      <grid cols=3 gap=2 min=180>
        <select stack=true bind="tr_job" options="{{ data.r.jobOptionsAny | tojson }}" search=true label="When job is"/>
        <input stack=true bind="tr_text" label="and description contains"/>
        <select stack=true bind="tr_type" options="{{ data.r.typeOptions | tojson }}" label="→ Type"/>
      </grid>
      <row gap=2>
        <button run="zeiterfassung.rule-op" with="what=types, op=add, jobNumber={{ state.tr_job }}, description={{ state.tr_text }}, type={{ state.tr_type }}" into="rsaved" then="tr_text=" emit="rules-changed" label="Add rule" variant=primary/>
        <button run="zeiterfassung.rule-op" with="what=types, op=none, apply=true" into="rsaved" emit="rules-changed" label="Apply to existing entries" confirm="Re-type the existing entries by these rules?" variant=plain/>
      </row>
    </col>
  </section>

  <section card=true title="Report rewriting">
    <col gap=2>
      <text tone=muted>Rules that rewrite and group the “Report” view on the weekly page — a condition on each entry maps to an output label, and optionally to tags for those entries. The first rule that matches wins.</text>
      {{#each data.r.reportRules}}
      <row gap=2 align=center wrap=true>
        <text>When <b>{{ when }}</b> → <b>{{ template }}</b> <small><muted>{{ tags }}</muted></small></text>
        <button action="state" state="ruleedit" value="report:{{ i }}" label="✎" tip="Edit" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=report, op=up, index={{ i }}" into="rsaved" emit="rules-changed" label="↑" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=report, op=down, index={{ i }}" into="rsaved" emit="rules-changed" label="↓" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=report, op=remove, index={{ i }}" into="rsaved" emit="rules-changed" label="✕" variant=quiet/>
      </row>
      {{/each}}
      <grid cols=3 gap=2 min=180>
        <select stack=true bind="rr_f1" options="{{ data.r.fieldOptions | tojson }}" label="Condition 1"/><input stack=true bind="rr_v1" label="value"/>
        <input stack=true bind="rr_template" label="Output" placeholder="{ticket}: {desc}"/>
        <select stack=true bind="rr_f2" options="{{ data.r.fieldOptions | tojson }}" label="Condition 2"/><input stack=true bind="rr_v2" label="value"/>
        <input stack=true bind="rr_tags" label="Tags" placeholder="mob"/>
      </grid>
      <small><muted>Leave a value empty to leave its condition out; no condition at all matches every entry.</muted></small>
      <row gap=2>
        <button run="zeiterfassung.rule-op" with="what=report, op=add, f1={{ state.rr_f1 }}, v1={{ state.rr_v1 }}, f2={{ state.rr_f2 }}, v2={{ state.rr_v2 }}, template={{ state.rr_template }}, tags={{ state.rr_tags }}" into="rsaved" then="rr_v1=" emit="rules-changed" label="Add rule" variant=primary/>
        <button run="zeiterfassung.rule-op" with="what=report, op=none, apply=true" into="rsaved" emit="rules-changed" label="Tag existing entries" confirm="Give the existing entries the tags of their rule?" variant=plain/>
      </row>
    </col>
  </section>

  {{#if data.r.meetings}}
  <section card=true title="Meeting → job rules">
    <col gap=2>
      <text tone=muted>Auto-pick a job when importing meetings, by matching the meeting title — e.g. book every “Mob Programming” meeting on your Relaunch job.</text>
      {{#each data.r.meetingRules}}
      <row gap=2 align=center wrap=true>
        <text>Title contains <b>{{ match }}</b> → <b>{{ job }}</b>{{#if group}} <small><muted>(group meeting)</muted></small>{{/if}}</text>
        <button action="state" state="ruleedit" value="meetings:{{ i }}" label="✎" tip="Edit" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=up, index={{ i }}" into="rsaved" emit="rules-changed" label="↑" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=down, index={{ i }}" into="rsaved" emit="rules-changed" label="↓" variant=quiet/>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=remove, index={{ i }}" into="rsaved" emit="rules-changed" label="✕" variant=quiet/>
      </row>
      {{/each}}
      <grid cols=3 gap=2 min=180>
        <input stack=true bind="mr_match" label="Title contains"/>
        {{#if data.r.jobOptions}}<select stack=true bind="mr_job" options="{{ data.r.jobOptions | tojson }}" search=true label="Job"/>{{#else}}<text tone=warn>Create a job first — rules book meetings on a job number.</text>{{/if}}
        <toggle bind="mr_group" label="Group meeting (a mob day)"/>
      </grid>
      <row gap=2>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=add, match={{ state.mr_match }}, jobNumber={{ state.mr_job }}, group={{ state.mr_group }}" into="rsaved" then="mr_match=" emit="rules-changed" label="Add rule" variant=primary/>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=none, apply=true" into="rsaved" emit="rules-changed" label="Reapply to imported meetings" confirm="Move the imported meetings that match a rule to its job?" variant=plain/>
      </row>
      <row gap=2 align=end>
        <select stack=true bind="mr_default" options="{{ data.r.jobOptionsAny | tojson }}" search=true label="Job for every other meeting"/>
        <button run="zeiterfassung.rule-op" with="what=meetings, op=default, jobNumber={{ state.mr_default | default(data.r.meetingDefaultJob) }}" into="rsaved" emit="rules-changed" label="Save" variant=plain/>
      </row>
    </col>
  </section>

  <section card=true title="Meeting exclude rules">
    <col gap=2>
      <text tone=muted>Imported meetings whose title contains one of these start unticked — for placeholders and reminders like “Zeiten in Chrono Erfassen”.</text>
      {{#each data.r.excludeRules}}
      <row gap=2 align=center><text>{{ value }}</text><button action="state" state="ruleedit" value="exclude:{{ i }}" label="✎" tip="Edit" variant=quiet/><button run="zeiterfassung.rule-op" with="what=exclude, op=remove, index={{ i }}" into="rsaved" emit="rules-changed" label="✕" variant=quiet/></row>
      {{/each}}
      <row gap=2 align=end>
        <input stack=true bind="ex_value" label="Title contains"/>
        <button run="zeiterfassung.rule-op" with="what=exclude, op=add, value={{ state.ex_value }}" into="rsaved" then="ex_value=" emit="rules-changed" label="Add" variant=primary/>
      </row>
    </col>
  </section>
  {{/if}}

  <section card=true title="Parallel work">
    <col gap=2>
      <text tone=muted>Two tasks of one job done at the same time (by their start and hours) are not booked on top of each other. Choose how they are booked when Zeff notices — you can change each case afterwards.</text>
      <row gap=2 align=end wrap=true>
        <select stack=true bind="pm_mode" options="{{ data.r.parallelOptions | tojson }}" value="{{ data.r.parallelMode }}" label="Parallel work, by default"/>

{{#if data.w}}

      {{#if data.w.booked.todayHours}}<text><muted>Today </muted>{{#if data.w.booked.todayDone}}<b tone=good>{{ data.w.booked.todayHours }}</b>{{#else}}<b>{{ data.w.booked.todayHours }}</b>{{/if}}<muted>{{ data.w.booked.todayOf }}</muted></text>{{/if}}
    </tile>

      {{#if data.w.past.weeks}}<row gap=1 wrap=true>{{#each data.w.past.weeks}}<button action="state" state="week" value="{{ key }}" label="{{ label }}" tip="{{ title }}" variant=chip tone="{{ missing ? 'bad' : 'good' }}"/>{{/each}}</row>{{/if}}
    </tile>
    {{#each data.w.slots.cards}}<tile tint=true label="{{ label }}" value="{{ value }}" sub="{{ sub }}" tone="{{ tone }}"/>{{/each}}
  </grid>

  <section card=true title="Hours per job and day">
    {{#if data.w.slots.actions}}<row gap=2 wrap=true justify=end>{{#each data.w.slots.actions}}<button run="{{ flow }}" with="{{ with }}" emit="time-changed" confirm="{{ confirm }}" label="{{ label }}" tip="{{ tip }}" variant=plain/>{{/each}}</row>{{/if}}

      <shead><srow>
        <scell head=true>Job</scell>

          <scell num=true></scell>
        </srow>
        {{/if}}

  <dialog bind="sugedit" reset="s_" title="Suggested entries">
    {{#each data.w.suggestions.items | where('id', state.sugedit)}}

      <input bind="s_desc" label="Description" value="{{ description }}"/>
      <input bind="s_hours" type=number label="Hours" value="{{ hours }}"/>

        <button run="zeiterfassung.suggestion" with="id={{ id }}, accept=true, hours={{ state.s_hours | default(hours) }}, description={{ state.s_desc | default(description) }}" emit="time-changed" then="sugedit=" done="Accepted." label="Accept" variant=primary/>
      </row>
    </col>
    {{/each}}
  </dialog>
  {{/if}}

  {{#if data.w.done}}
  <section card=true title="Done today">
    <small><muted>Todos ticked off today and time tracked on todos today, by ticket — adjust the hours and the words, then add them as entries.</muted></small>
    {{#each data.w.done}}
    <box>
      <row gap=2 wrap=true align=baseline><mono>{{ ticket }}</mono><text>{{ summary }}</text>{{#if job}}<small><muted>{{ job }}</muted></small>{{#else}}<text tone=warn>{{ noJobText }}</text>{{/if}}</row>
      <text>{{ description }}</text>
      <small><muted>{{ todos }}</muted></small>
      {{#if time}}<small><muted>{{ time }}</muted></small>{{/if}}
      <row gap=2 align=center justify=end>
        <b>{{ hoursText }} h</b>
        {{#if job}}<button run="zeiterfassung.done-today" with="ticket={{ ticket }}, todoIds={{ todoIds | tojson }}, hours={{ hours }}, description={{ description }}" emit="time-changed" done="Booked." label="Add" variant=primary/>{{/if}}
        <button run="zeiterfassung.done-today" with="ticket={{ ticket }}, todoIds={{ todoIds | tojson }}, skip=true" emit="time-changed" done="Skipped." label="Skip" variant=plain/>
      </row>
    </box>
    {{/each}}
  </section>
  {{/if}}

  <dialog bind="pauseday" reset="pz_" title="Pause">
    {{#each data.w.table.foot.pause | where('iso', state.pauseday)}}
    <col gap=2>
      <text>{{ label }}</text>
      <input bind="pz_text" label="Break" value="{{ current }}" placeholder="12:00-12:30"/>
      <row gap=2 wrap=true>
        <button run="zeiterfassung.entry-op" with="op=pauses, dates={{ iso }}, text={{ state.pz_text | default(current) }}" emit="time-changed" then="pauseday=" label="Save" variant=primary/>
        {{#if suggest}}<button run="zeiterfassung.entry-op" with="op=pauses, dates={{ iso }}, text={{ suggest }}" emit="time-changed" then="pauseday=" label="Use {{ suggest }}" variant=plain/>{{/if}}
        <button run="zeiterfassung.entry-op" with="op=pauses, dates={{ iso }}, text=none" emit="time-changed" then="pauseday=" label="No break" variant=plain/>
        <button run="zeiterfassung.entry-op" with="op=pauses, dates={{ iso }}, text=" emit="time-changed" then="pauseday=" label="Remove" variant=plain/>
      </row>
    </col>
    {{/each}}
  </dialog>

  {{#if data.w.parallel.sets}}
  <section card=true tone=warn title="{{ data.w.parallel.head }} {{ data.w.parallel.sets | count }}">
    <small tone=warn>{{ data.w.parallel.hint }}</small>
    {{#each data.w.parallel.sets}}
    <box dense=true>
      <col gap=1>
      <row gap=3 wrap=true align=baseline><b>{{ label }}</b><small tone=muted><mono>{{ when }}</mono></small><small tone=warn>{{ cost }}</small></row>
      {{#each lines}}<text>{{ this }}</text>{{/each}}
      <row gap=2 wrap=true>
        <button run="zeiterfassung.entry-op" with="op=parallel, mode=combine, ids={{ ids }}" emit="time-changed" done="Combined into one spanning entry." label="Book all on group ({{ span }} h)" variant=plain/>
        <button run="zeiterfassung.entry-op" with="op=parallel, mode=divide, ids={{ ids }}" emit="time-changed" done="The stretch's hours are divided between the entries." label="Divide time on subtasks ({{ span }} h)" variant=plain/>
        <button run="zeiterfassung.entry-op" with="op=parallel, mode=sequential, ids={{ ids }}" emit="time-changed" done="Booked one after the other." label="Book sequential" variant=plain/>
      </row>
      </col>
    </box>
    {{/each}}
  </section>
  {{/if}}

  <section card=true title="{{ data.w.report.head }}" aside="grouped per day · configure on Schedule">
    {{#if data.w.slots.exports}}<row gap=2 wrap=true justify=end>{{#each data.w.slots.exports}}{{#if href}}<button action="url" href="{{ href }}" label="{{ label }}" tip="{{ tip }}" variant=link/>{{#else}}<button run="{{ flow }}" with="{{ with }}" label="{{ label }}" tip="{{ tip }}" variant=link/>{{/if}}{{/each}}</row>{{/if}}
    {{#if data.w.report.days}}
    <row justify=between gap=2><text tone=muted>rewritten by your report rules</text><copy text="{{ data.w.report.text }}" label="Copy report"/></row>
    <col gap=3>
    {{#each data.w.report.days}}
    <section framed=true collapsible=true open="{{ open ? 'true' : 'false' }}" title="{{ dayText }}" note="{{ linesText }}" aside="{{ total }}">
      {{#each lines}}
      <let name="lo" value="state | get(key)"/>
      <col gap=1>
        <row justify=between gap=3 wrap=false align=start>
          <row gap=1 wrap=false align=baseline>{{#if expandable}}<button action="state" state="{{ key }}" value="{{ lo == '1' ? '' : '1' }}" label="{{ lo == '1' ? '▾' : '▸' }}" tip="{{ lo == '1' ? 'Hide its entries' : 'Show its entries' }}" variant=quiet/>{{/if}}<text>{{ label }} {{#if count}}<small tone=muted>{{ count }}</small>{{/if}} {{#if tags}}<small tone=muted>{{ tags }}</small>{{/if}}</text></row>
          <row gap=2 wrap=false><badge tint="{{ color }}">{{ type }}</badge><col width=64 align=end><b>{{ hours }}</b></col></row>
        </row>
        {{#if expandable and lo == '1'}}{{#each entries}}<row justify=between gap=3 wrap=false><small tone=muted>{{#if ticket}}{{#if ticketUrl}}<button action="url" href="{{ ticketUrl }}" label="{{ ticket }}" tip="{{ ticketTip }}" variant=link/>{{#else}}<mono>{{ ticket }}</mono>{{/if}} {{/if}}{{ description }} · {{ job }}</small><small tone=muted>{{ hours }}</small></row>{{/each}}{{/if}}
      </col>
      {{/each}}
    </section>
    {{/each}}
    </col>
    <row justify=between gap=2><b>Total</b><col width=64 align=end><b>{{ data.w.report.total }}</b></col></row>
    {{#else}}<empty text="No time booked in this week."/>{{/if}}
  </section>

  <section card=true title="{{ data.w.entriesHead }}" aside="{{ data.w.entryList | count }}" collapsible=true open=false>
    {{#if data.w.entryList}}
    <sheet compact=true caption="Entries of the week">
      <shead><srow><scell head=true>Date</scell><scell head=true>Job</scell><scell head=true num=true>Hours</scell><scell head=true>Report</scell><scell head=true>Group</scell><scell head=true>Ticket</scell><scell head=true>Type · tags</scell><scell head=true></scell></srow></shead>
      <sbody>
        {{#each data.w.entryList}}
        <srow hover=true>
          <scell><col gap=0><mono size=sm><edit type=date value="{{ date }}" label="Date" tip="Click to change the day" run="zeiterfassung.entry-op" with="op=date, id={{ id }}, date=$value" emit="time-changed" done="Saved."/></mono>{{#if start}}<small tone=muted><mono><edit type=time value="{{ start }}" label="Start" tip="When the work began" run="zeiterfassung.entry-op" with="op=start, id={{ id }}, start=$value" emit="time-changed" done="Saved."/></mono></small>{{/if}}</col></scell>
          <scell><col width=150><truncate tip="{{ job }}">{{ jobName }}</truncate></col></scell>
          <scell num=true bold=true><col gap=0 align=end><edit type=number value="{{ hours }}" text="{{ hoursText }}" min=0.25 max=24 step=0.25 label="Hours" tip="Click to change the hours" run="zeiterfassung.entry-hours" with="id={{ id }}, hours=$value" emit="time-changed" done="Saved."/>{{#if worked}}<small tone=muted>{{ worked }}</small>{{/if}}</col></scell>
          <scell><row gap=1 wrap=false align=baseline>{{#if draggable}}<drag value="{{ id }}" tip="Drag onto a collecting entry">⠿</drag>{{/if}}<col fill=true>{{#if dropKey}}<drop bind="{{ dropKey }}" emit="entry-dropped" label="Drop here">{{ description }}</drop>{{#else}}<text>{{ description }}</text>{{/if}}{{#if comment}}<small tone=muted>💬 {{ comment }}</small>{{/if}}</col></row></scell>
          <scell>{{#if groupText}}<col gap=0><small>{{ groupText }}</small>{{#if books}}<small tone=muted>{{ books }}</small>{{/if}}</col>{{/if}}</scell>
          <scell>{{#if ticket}}{{#if ticketUrl}}<button action="url" href="{{ ticketUrl }}" label="{{ ticket }}" tip="{{ ticketTip }}" variant=link/>{{#else}}<mono size=sm>{{ ticket }}</mono>{{/if}}{{/if}}</scell>
          <scell><col gap=1 align=start><badge tint="{{ color }}">{{ type }}</badge>{{#each tagNames}}<badge color=teal>{{ this }}</badge>{{/each}}{{#if mark}}<small tip="{{ markTitle }}">{{ mark }}</small>{{/if}}</col></scell>
          <scell>
            <row gap=0 justify=end wrap=false>
              {{#if ctxCount}}<button action="state" state="ctxentry" value="{{ id }}" label="💬 {{ ctxCount }}" tip="Context" variant=quiet/>{{/if}}
              <button action="state" state="entryedit" value="{{ id }}" label="✎" tip="Edit this entry" variant=quiet/>
              <button action="state" state="ctxentry" value="{{ id }}" label="＋" tip="Context" variant=quiet/>
              <button action="state" state="groupedit" value="{{ id }}" label="⛓" tip="Group" variant=quiet/>
              <button action="state" state="entrycopy" value="{{ id }}" label="⧉" tip="Copy to another day" variant=quiet/>
              <button run="zeiterfassung.delete-entry" with="id={{ id }}" confirm="Delete this entry?" emit="time-changed" done="Deleted." label="✕" variant=quiet/>
            </row>
              </scell>
        </srow>
        {{/each}}
      </sbody>
    </sheet>
    {{#else}}<empty text="No entries."/>{{/if}}
  </section>
  <dialog bind="hoursedit" reset="e_hours" title="Hours">
    {{#each data.w.entryList | where('id', state.hoursedit)}}
    <col gap=2>
      <text>{{ description }}</text>
      <input bind="e_hours" type=number label="Hours" value="{{ hours }}"/>
      <row gap=2>
        <button run="zeiterfassung.entry-hours" with="id={{ id }}, hours={{ state.e_hours | default(hours) }}" emit="time-changed" then="hoursedit=" done="Saved." label="Save" variant=primary/>
      </row>
    </col>
    {{/each}}
  </dialog>
  <dialog bind="entryedit" reset="ee_" title="Edit this entry" wide=true>
    {{#each data.w.entryList | where('id', state.entryedit)}}

    <col gap=2>
      <grid cols=3 gap=2 min=170>
        <input bind="ee_date" type=date label="Date" value="{{ date }}"/>
        {{#if data.w.form.bookOptions}}<select bind="ee_bookon" value="{{ bookOn }}" options="{{ data.w.form.bookOptions | tojson }}" search=true label="Book on"/>{{#else}}<text tone=warn>No active jobs yet — create one on the Jobs page before booking time.</text>{{/if}}
        <input bind="ee_ticket" label="Ticket" value="{{ ticket }}"/>
        <input bind="ee_hours" type=number label="Hours" value="{{ hours }}"/>
        {{#if data.w.form.typeOptions}}<select bind="ee_type" value="{{ typeKey }}" options="{{ data.w.form.typeOptions | tojson }}" label="Type"/>{{#else}}<text tone=warn>…</text>{{/if}}
        <input bind="ee_start" label="Start" value="{{ start }}" placeholder="09:30"/>
      </grid>
      <input bind="ee_description" label="Description" value="{{ description }}"/>
      <grid cols=2 gap=2 min=200>
        <input bind="ee_tags" label="Tags" value="{{ tagsText }}"/>
        <input bind="ee_comment" label="Comment" value="{{ comment }}"/>
      </grid>
      <button action="state" state="ee_group" value="{{ grp == 'true' ? 'false' : 'true' }}" label="{{ grp == 'true' ? '☑' : '☐' }} Group entry" variant=quiet/>
      <row gap=2>
        <button run="zeiterfassung.entry-op" with="op=update, id={{ id }}, date={{ state.ee_date | default(date) }}, bookOn={{ state.ee_bookon | default(bookOn) }}, hours={{ state.ee_hours | default(hours) }}, type={{ state.ee_type | default(typeKey) }}, ticket={{ state.ee_ticket | default(ticket) }}, start={{ state.ee_start | default(start) }}, description={{ state.ee_description | default(description) }}, tags={{ state.ee_tags | default(tagsText) }}, comment={{ state.ee_comment | default(comment) }}, isGroup={{ grp }}" emit="time-changed" then="entryedit=" done="Saved." label="Save" variant=primary/>
      </row>
    </col>
    {{/each}}
  </dialog>
  <on event="entry-dropped" run="zeiterfassung.entry-op" with="op=drop, state={{ state | tojson }}" then="{{ data.w.dropClear }}" emit="time-changed"/>

  <dialog bind="ctxentry" reset="cx_, src_" title="Context" wide=true>
    {{#if data.ctx.found}}
    <col gap=2>
      <b>{{ data.ctx.title }}</b>
      <small><muted>{{ data.ctx.created }}</muted></small>
      {{#if data.ctxdone.ctxdone.message}}<callout tone=good>{{ data.ctxdone.ctxdone.message }}</callout>{{/if}}
      {{#each data.ctx.contexts}}
      <box>
        <row gap=2 justify=between wrap=true>
          <row gap=2 wrap=true><b>{{ kind }}</b><text>{{ headline }}</text><small><muted>{{ author }} {{ date }} {{ ticket }}</muted></small>{{#if jira}}<small><muted>{{ jira }}</muted></small>{{/if}}</row>
          <row gap=1>
            <button run="zeiterfassung.entry-op" with="op=context-move, id={{ data.ctx.id }}, contextId={{ id }}, dir=up" emit="time-changed" label="↑" variant=quiet/>

        <markdown value="{{ body }}"/>

      {{/each}}
      {{#if data.ctx.contexts}}
      <row gap=2><button run="zeiterfassung.entry-op" with="op=context-sync, id={{ data.ctx.id }}" into="ctxdone" emit="time-changed" confirm="Post these items to their Jira tickets?" label="Sync to Jira" variant=plain/></row>
      {{/if}}
      {{#if data.ctx.todos}}<section title="From todos" collapsible=true open=false>{{#each data.ctx.todos}}<small>{{ this }}</small>{{/each}}{{#each data.ctx.sources}}<small><muted>{{ this }}</muted></small>{{/each}}{{#each data.ctx.notes}}<small>{{ this }}</small>{{/each}}</section>{{/if}}
      <section title="Add context">
        <col gap=2>
          <grid cols=2 gap=2 min=160>
            <select bind="cx_kind" options="{{ data.ctx.kindOptions | tojson }}" label="Kind"/>

            <input bind="cx_author" label="Author"/>
            <input bind="cx_ticket" label="Ticket" value="{{ data.ctx.ticket }}"/>

          <input bind="cx_links" type=textarea rows=2 label="Links (one per line)"/>
          <input bind="cx_body" type=textarea rows=3 label="Message"/>
          <row gap=2 wrap=true>
            <button run="zeiterfassung.entry-op" with="op=context-add, id={{ data.ctx.id }}, ctxKind={{ state.cx_kind }}, ctxTitle={{ state.cx_title }}, ctxAuthor={{ state.cx_author }}, ctxLinks={{ state.cx_links }}, ctxBody={{ state.cx_body }}, ctxTicket={{ state.cx_ticket | default(data.ctx.ticket) }}, ctxDate={{ data.ctx.date }}" emit="time-changed" then="cx_body=; cx_title=; cx_links=" done="Context added." label="Add" variant=primary/>
            <upload bind="ctxbusy" run="zeiterfassung.entry-op" with="op=context-file, id={{ data.ctx.id }}, contextId=0" multiple=true zone=view done="Context added." emit="time-changed" label="+ Files as an item of their own"/>
          </row>
        </col>
      </section>
      <section title="Link existing">
        <row gap=2 align=end wrap=true>
          <select bind="cx_link" options="{{ data.ctx.linkable | tojson }}" search=true label="Context item"/>
          <button run="zeiterfassung.entry-op" with="op=context-link, id={{ data.ctx.id }}, contextId={{ state.cx_link }}" emit="time-changed" done="Context linked." label="Link" variant=plain/>
        </row>
      </section>

          <row gap=2 justify=between align=center><col><small><muted>{{ section }} · {{ meta }}</muted></small><text>{{ text }}</text></col><button run="zeiterfassung.entry-op" with="op=source-add, id={{ data.ctx.id }}, url={{ url }}, ticket={{ data.ctx.ticket }}" emit="time-changed" done="Added." label="+ Add" variant=plain/></row>
          {{/each}}
          {{/if}}
        </col>
      </section>
    </col>
    {{/if}}
  </dialog>
  <data name="src" lambda="zeiterfassung.source-search" with="q={{ state.src_q }}" when="{{ state.src_q }}" debounce=400/>
  <dialog bind="ctxedit" reset="ce_" title="Edit context item" wide=true>
    {{#each data.ctx.contexts | where('id', state.ctxedit)}}

      <grid cols=2 gap=2 min=160>
        <select bind="ce_kind" options="{{ data.ctx.kindOptions | tojson }}" label="Kind"/>

        <input bind="ce_ticket" label="Ticket" value="{{ ticket }}"/>
        <input bind="ce_date" type=date label="Date" value="{{ dateRaw }}"/>
      </grid>
      <input bind="ce_links" type=textarea rows=2 label="Links (one per line)" value="{{ linksText }}"/>
      <input bind="ce_body" type=textarea rows=4 label="Message" value="{{ body }}"/>
      <row gap=2><button run="zeiterfassung.entry-op" with="op=context-edit, contextId={{ id }}, ctxKind={{ state.ce_kind | default(kindKey) }}, ctxTitle={{ state.ce_title | default(title) }}, ctxAuthor={{ state.ce_author | default(author) }}, ctxTicket={{ state.ce_ticket | default(ticket) }}, ctxDate={{ state.ce_date | default(dateRaw) }}, ctxLinks={{ state.ce_links | default(linksText) }}, ctxBody={{ state.ce_body | default(body) }}" emit="time-changed" then="ctxedit=" done="Context saved." label="Save" variant=primary/></row>

      <input bind="ec_date" type=date label="Day" value="{{ date }}"/>
      <row gap=2><button run="zeiterfassung.entry-op" with="op=copy, id={{ id }}, date={{ state.ec_date | default(date) }}" emit="time-changed" then="entrycopy=" done="Copied." label="Copy" variant=primary/></row>
    </col>
    {{/each}}
  </dialog>
  <dialog bind="groupedit" reset="gs_" title="Group">
    {{#each data.w.entryList | where('id', state.groupedit)}}

      {{#if groupText}}<small><muted>{{ groupText }} {{ books }}</muted></small>{{/if}}
      <input bind="gs_start" label="Start" value="{{ start }}" placeholder="09:30"/>
      <row gap=2><button run="zeiterfassung.entry-op" with="op=start, id={{ id }}, start={{ state.gs_start | default(start) }}" emit="time-changed" done="Saved." label="Set the start" variant=plain/></row>

      </row>
      {{/if}}
      {{#if spanId}}
      <select bind="gs_mode" options="{{ modeOptions | tojson }}" label="How the group books"/>

    </col>
    {{/each}}
  </dialog>
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>
