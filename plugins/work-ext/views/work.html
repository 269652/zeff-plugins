<dock edge=bottom plain=true center=true>
<col gap=2>
{{#each data.x.session.asks}}
{{#if question}}
<box tone=info compact=true>
{{#each questions}}
<col gap=1>
<row gap=2 align=center>{{#if header}}<pill label="{{ header }}" tone=run shape=tag/>{{/if}}<b>{{ question }}</b></row>
<row gap=2 wrap=true>{{#each options}}<button action="state" state="qpick" value="{{ next }}" label="{{ label }}" sub="{{ description }}" tip="{{ description }}" variant="{{ on ? 'primary' : 'plain' }}"/>{{/each}}</row>
{{#if idx == 0}}<input bind="qo0" size=sm placeholder="Or your own answer …"/>{{/if}}
{{#if idx == 1}}<input bind="qo1" size=sm placeholder="Or your own answer …"/>{{/if}}
{{#if idx == 2}}<input bind="qo2" size=sm placeholder="Or your own answer …"/>{{/if}}
{{#if idx == 3}}<input bind="qo3" size=sm placeholder="Or your own answer …"/>{{/if}}
</col>

<row gap=2 wrap=true align=center>
<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=allow, answers={{ submit }}" then="qpick=" emit="work-changed" label="Answer" variant=primary disabled="{{ not ready }}"/>

{{#if more}}<small><muted>{{ more }}</muted></small>{{/if}}
</row>
</box>

<box tone=ask compact=true title="{{ title }}" aside="{{ description && not plan ? '— ' + description : '' }}{{ more ? '  ' + more : '' }}">

<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=allow, then=acceptEdits" emit="work-changed" label="Yes — accept its edits" variant=primary/>

{{#if url}}<small><mono>{{ url }}</mono></small>{{/if}}

{{#if state.note}}<input bind="note" type=textarea rows=2 placeholder="What should it do instead? (it reads this)"/>{{/if}}
<row gap=2 wrap=true>
<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=allow" emit="work-changed" label="Allow" variant=primary keys="enter" tip="Enter"/>

</row>
{{/if}}
</box>

<row gap=1 align=center wrap=false>
<pill shape=bare dot="{{ data.x.session.live.dot == 'run' ? 'pulse' : 'still' }}" tone="{{ data.x.session.live.dot }}" label="{{ data.x.session.hostText }}"/>

{{#if data.x.session.elevated}}<pill label="{{ data.x.session.elevatedLabel }}" tone=bad bold=true shape=tag/>{{/if}}
</row>
<button run="work.live" with="run={{ data.x.session.runId }}, do=wrap-up" emit="work-changed" label="Finish" tip="It sums up and gives its result — that ends the session: its todo ticked off, the time suggested." variant=quiet disabled="{{ data.x.session.live.working }}"/>

{{#else}}
<grow/>

{{#if data.x.session.isShell}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=shell, cmd={{ data.x.session.shellCmd }}" into="shellout" then="msg=" emit="work-changed" label="↑" tip="Run" variant=send disabled="{{ not data.x.session.shellCmd }}"/>

<button run="work.live" with="run={{ data.x.session.runId }}, do=interrupt" emit="work-changed" label="■" tip="Stop its current turn (Esc)" variant=send/>

{{#if data.x.session.canReplyLive}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=send, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="↑" tip="Send" variant=send disabled="{{ not state.msg }}"/>
{{#else}}
<button run="work.send" with="run={{ data.x.session.runId }}, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="↑" tip="Send" variant=send disabled="{{ not state.msg }}"/>
